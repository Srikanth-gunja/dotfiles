
[[language]]
name = "python"
formatter = { command = "ruff", args = ["format", "-"] }
auto-format = true
language-servers = ["pyright"]

[[language]]
name = "tsx"
formatter = { command = "prettier", args = ["--parser", "babel-ts"] }
auto-format = true

[[language]]
name = "typescript"
formatter = { command = "prettier", args = ["--parser", "typescript"] }
auto-format = true

[[language]]
name = "jsx"
formatter = { command = "prettier", args = ["--parser", "babel"] }
auto-format = true

[[language]]
name = "javascript"
formatter = { command = "prettier", args = ["--parser", "babel"] }
auto-format = true

[[language]]
name = "rust"
auto-format = true

[[language]]
name = "cpp"
formatter = { command = "clang-format" }
auto-format = true
[language-server.rust-analyzer.config]
checkOnSave = true
inlayHints = { typeHints = true, parameterHints = true }

[[language]]
name = "go"
auto-format = true
formatter = { command = "gofumpt" }
language-servers = ["gopls"]

[language-server.gopls]
command = "gopls"
args = ["serve"]

[language-server.gopls.config]
usePlaceholders = true
completeUnimported = true
staticcheck = true
gofumpt = true

[language-server.gopls.config.codelenses]
test = true
tidy = true
upgrade_dependency = true
vendor = true
regenerate_cgo = true

[language-server.gopls.config.hints]
assignVariableTypes = true
compositeLiteralFields = true
compositeLiteralTypes = true
constantValues = true
functionTypeParameters = true
parameterNames = true
rangeVariableTypes = true

[language-server.gopls.config.analyses]
ST1000 = true
ST1003 = true
fieldalignment = true
nilness = true
shadow = true
unusedparams = true
unusedwrite = true
useany = true
